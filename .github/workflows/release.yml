name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 1.2.0, no v prefix)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Prepare release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $INPUT_VERSION" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update manifest.json version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            m.version = process.env.VERSION;
            fs.writeFileSync("manifest.json", JSON.stringify(m, null, 2) + "\n");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.version = process.env.VERSION;
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            lock.version = process.env.VERSION;
            lock.packages[""].version = process.env.VERSION;
            fs.writeFileSync("package-lock.json", JSON.stringify(lock, null, 2) + "\n");
            console.log("Prepared manifest.json version", process.env.VERSION);
          '

      - name: Install locked build dependencies
        run: npm ci

      - name: Test and build self-contained release assets
        run: npm run check

      - name: Install isolated UI test browser
        run: npx playwright install --with-deps chromium

      - name: Verify responsive controls and data workflows
        run: npm run test:ui

      - name: Prepare release notes from changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-notes.mjs

      - name: Commit version update when needed
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json package-lock.json main.js styles.css
          if git diff --cached --quiet; then
            echo "manifest.json is already at $VERSION; continuing without a commit"
          else
            git commit -m "chore: bump version to $VERSION"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Validate release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -s main.js
          test -s manifest.json
          test -s styles.css
          node --check main.js
          node -e '
            const manifest = require("./manifest.json");
            if (manifest.version !== process.env.VERSION) {
              throw new Error(`manifest version ${manifest.version} does not match ${process.env.VERSION}`);
            }
          '

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body_path: output/release-notes.md
          files: |
            main.js
            manifest.json
            styles.css
